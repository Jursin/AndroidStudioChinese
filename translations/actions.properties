# 用语约定：Gradle / Java / Kotlin / AGP / SDK / JVM / JDK / Compose / Activity / APK / AAB
# 等专有名词原样保留，不翻译；术语跟随 JetBrains 官方中文包（build=构建、clean=清理）。
# 按 action id 覆盖菜单文案（Android Studio 把它们内联在 META-INF/*.xml 或硬编码在 AnAction 里，
# 资源语言包够不到）。键 = action id，值 = 中文；可加 <id>.description=...
#
# 生成完整 id 清单：python3 scripts/zhpack.py audit-actions --ide-home <AS>

